<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">

      <div class="card border-0" style="background-color: #0e1624; border: 1px solid rgba(255,183,40,0.15) !important;">
        <div class="card-body p-4">

          <!-- Header -->
          <div class="text-center mb-4">
            <i class="bi bi-sun-fill text-warning fs-1"></i>
            <p class="font-monospace small text-uppercase opacity-75 mb-0" style="color: #ffb728;">Proyecto Apolo</p>
            <h3 class="fw-bold text-white mb-0" style="font-family:'Bebas Neue',sans-serif; letter-spacing:.04em;">
              Crear Cuenta
            </h3>
          </div>

          <form [formGroup]="formulario">

            <div class="mb-3">
              <label class="form-label font-monospace small text-uppercase" style="color: #8a9bb5; letter-spacing:.1em;">
                Email
              </label>
              <input type="email" formControlName="email" id="emailId"
                class="form-control"
                [ngClass]="emailValidation"
                placeholder="usuario@email.com"
                style="background-color: #080c14; border: 1px solid rgba(255,183,40,0.2); color: #e8edf5; border-radius: 8px;"
              />
            </div>

            <div class="mb-3">
              <label class="form-label font-monospace small text-uppercase" style="color: #8a9bb5; letter-spacing:.1em;">
                Contraseña
              </label>
              <input type="password" formControlName="password" id="passwordId"
                class="form-control"
                [ngClass]="{ 'is-valid': passwordValid('password'), 'is-invalid': passwordNotValid('password') }"
                placeholder="••••••••"
                style="background-color: #080c14; border: 1px solid rgba(255,183,40,0.2); color: #e8edf5; border-radius: 8px;"
              />
            </div>

            <div class="mb-3">
              <label class="form-label font-monospace small text-uppercase" style="color: #8a9bb5; letter-spacing:.1em;">
                Verificar Contraseña
              </label>
              <input type="password" formControlName="password2" id="passwordId2"
                class="form-control"
                [ngClass]="{ 'is-valid': passwordValid('password2'), 'is-invalid': passwordNotValid('password2') }"
                placeholder="••••••••"
                style="background-color: #080c14; border: 1px solid rgba(255,183,40,0.2); color: #e8edf5; border-radius: 8px;"
              />
            </div>

            @if (passwordCrossValidation) {
              <div class="alert border font-monospace small py-2" role="alert"
                   style="background: rgba(255,77,106,0.1); border-color: rgba(255,77,106,0.4) !important; color: #ff4d6a;">
                <i class="bi bi-exclamation-circle me-1"></i>Las contraseñas no coinciden
              </div>
            }

            @if (errorMessage() != "") {
              <div class="alert border font-monospace small py-2" role="alert"
                   style="background: rgba(255,77,106,0.1); border-color: rgba(255,77,106,0.4) !important; color: #ff4d6a;">
                <i class="bi bi-exclamation-circle me-1"></i>{{ errorMessage() }}
              </div>
            }

            <button type="submit" (click)="register()"
              class="btn w-100 font-monospace mt-2"
              style="background: rgba(255,183,40,0.1); border: 1px solid rgba(255,183,40,0.4); color: #ffb728;">
              <i class="bi bi-person-plus me-2"></i>Registrarse
            </button>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
