<div class="table-responsive">
  <table class="table table-borderless apolo-table mb-0">
    <thead class="apolo-table-head">
      <tr>
        <th class="font-monospace small text-uppercase py-3 ps-3">
          <i class="bi bi-sun me-1"></i>Nombre
        </th>
        <th class="font-monospace small text-uppercase py-3">
          <i class="bi bi-geo-alt-fill me-1"></i>Ubicación
        </th>
        <th class="font-monospace small text-uppercase py-3">
          <i class="bi bi-person-fill me-1"></i>Usuario
        </th>
        <th class="font-monospace small text-uppercase py-3">
          <i class="bi bi-lightning-charge-fill me-1"></i>Capacidad
        </th>
        <th class="font-monospace small text-uppercase py-3">
          <i class="bi bi-gear-fill me-1"></i>Acciones
        </th>
      </tr>
    </thead>
    <tbody>
      @for (planta of plantas(); track planta.id) {
        <tr app-plantas-fila [plantaId]="planta" (accion)="onAction($event)"></tr>
      }
    </tbody>
  </table>
</div>
